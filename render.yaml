services:
  # FastAPI backend
  - type: web
    name: modelforge-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      # Set this after the frontend is deployed, to its public URL
      # (e.g. https://modelforge-frontend.onrender.com), then redeploy.
      - key: CORS_ORIGINS
        sync: false

  # React/Vite frontend, built as a static site
  - type: web
    name: modelforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the backend's public URL + /api (e.g.
      # https://modelforge-backend.onrender.com/api), then redeploy.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
